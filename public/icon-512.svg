  <rect x="180" y="164" width="32" height="200" fill="url(#gold)" rx="6"/>
  <rect x="240" y="164" width="32" height="200" fill="url(#gold)" rx="6"/>
  <rect x="300" y="164" width="32" height="200" fill="url(#gold)" rx="6"/>
  <rect x="360" y="164" width="32" height="200" fill="url(#gold)" rx="6"/>
  <!-- Base -->
